  <meta charset="UTF-8">

  <style>
    html {
      background: #000;
      font-family: monospace;
    }

    svg {
      position: absolute;
      margin: auto; 
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      animation : glitch 4s infinite;
    }

    @keyframes glitch {
      1%{
        transform: rotateX(7deg) skewX(70deg);
      }
      2%{
        transform: rotateX(0deg) skewX(0deg);
      }
    }

    @keyframes glitch-simple {
      15% {
        opacity: 1;
        clip-path: inset(0% 0% 70% 0%);
      }

      45% {
        opacity: 1;
        clip-path: inset(40% 0% 40% 0%);
      }

      75% {
        opacity: 1;
        clip-path: inset(60% 0% 10% 0%);
      }

      0%,
      30%,
      75%,
      90% {
        opacity: 0;
      }
    }
    @keyframes glitch-advance {
      3% {
        opacity: 1;
        clip-path: inset(0% 0% 70% 0%);
      }

      9% {
        opacity: 1;
        clip-path: inset(40% 0% 40% 0%);
      }

      15% {
        opacity: 1;
        clip-path: inset(60% 0% 10% 0%);
      }

      0%,
      6%,
      13%,
      18% {
        opacity: 0;
      }
    }

    @keyframes flash {
      0%,
      8%,
      15% {
        opacity: 0;
      }
      5%,
      13%,
      65% {
        opacity: 1;
      }
    }

    @keyframes clip {
      0%,
      6%,
      10%,
      15%,
      18% {
        opacity: 1;
      }
      5%,
      13% {
        opacity: 0.7;
        clip-path: inset(0 0 60%);
      }
      8%,
      65% {
        opacity: 0.7;
        clip-path: inset(60% 0 0);
      }
    }

  </style>
</head>

<script>
  $(function() {
  $.fn.glitchSVG = function(advance) {
    $.each(this, (i, el) => {
      let $svg = $(el),
        $group0 = $("<g></g>").append($svg.children().attr("fill", "")),
        $groupBase = $("<g></g>"),
        attrs = [
          {
            transform: "translate(-3, -2) skewX(3)",
            fill: "#123b63"
          },
          {
            transform: "translate(2, 2) skewX(-3)",
            fill: "#123b63"
          },
          {
            transform: "translate(2, 2)",
            fill: "#111111"
          },
          {
            fill: "#fff"
          }
        ];
      attrs.map((attr, i) => {
        let $g = $group0.clone();
        $g.attr(attr);
        if (i != attrs.length - 1) {
          $g.css({
            animation: advance
              ? `glitch-advance 5s ${(i + 0.1) * 1.3}s infinite`
              : `glitch-simple 1s ${(i + 0.1) * 0.3}s infinite`
          }).addClass("glitch-duplicate");
        } else if (advance) {
          $g.css({
            animation: `clip 10s infinite`
          });
        }
        $groupBase.append($g);
      });
      $svg.append($groupBase);
      if (advance) {
        let i = 0;
        while (i < 2) {
          let $g = $group0.clone();
          $g.attr({
            transform: `translate(${2 * (i == 0 ? 1 : -1)} , 0)`,
            fill: "#fff"
          }).css({
            animation: `flash 5s ${(i + 0.1) * 1.25}s infinite`,
            "clip-path": `inset(${i == 0 ? "0 0 50%" : "50% 0 0"})`
          });
          $svg.append($g);
          i++;
        }
      }
      $svg.html($svg.html());
    });
  };
  $("svg#simple").glitchSVG();
  $("svg#advance").glitchSVG(true);
  $("svg#image").glitchSVG(true);
});

</script>
